name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & logic tests
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The project uses Xcode 27's project format and a macOS 27.2 deployment target.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.2'

      - name: Show toolchain
        run: |
          sw_vers
          ls -d /Applications/Xcode*.app
          xcodebuild -version && swift --version
          {
            echo '### Toolchain'
            echo '```'
            sw_vers
            xcodebuild -version
            ls -d /Applications/Xcode*.app
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Logic tests
        run: ./scripts/test-logic.sh

      - name: Plugin lifecycle tests
        run: ./scripts/test-plugin-host.sh

      - name: App settings tests
        run: ./scripts/test-app-settings.sh

      - name: Build (Release, unsigned)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project machelper.xcodeproj -scheme machelper \
            -destination 'platform=macOS' -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build/xcodebuild.log || {
              # Surface the cause as annotations (visible on the run page without signing in).
              grep -E 'error:|xcodebuild: error' build/xcodebuild.log | sort -u | head -20 | sed 's/^/::error::/' || true
              tail -15 build/xcodebuild.log | sed 's/^/::notice::/'
              exit 1
            }

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
