name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & logic tests
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The project uses Xcode 27's project format and a macOS 27.2 deployment target.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: xcodebuild -version && swift --version

      - name: Logic tests
        run: ./scripts/test-logic.sh

      - name: Build (Release, unsigned)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project machelper.xcodeproj -scheme machelper \
            -destination 'platform=macOS' -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            build | tee build/xcodebuild.log

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
