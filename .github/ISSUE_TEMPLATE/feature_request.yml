name: 功能建议 / Feature request
description: 提一个新功能或改进 / Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题 / Problem
      description: 你现在遇到了什么不便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案 / Proposal
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案或参考 / Alternatives
      description: 其他工具是怎么做的、你考虑过的替代方式
